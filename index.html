    <noscript>
      <main>
        <section aria-label="Hero">
          <h1>Instagram Stories Component Library</h1>
          <p>
            Build beautiful, performant Instagram-style stories with
            <strong>react-instagram-stories</strong> — a high-performance React
            component. Smooth 3D cube drag transitions, touch gestures, and
            fully customizable with Tailwind CSS via classNames. Zero runtime
            dependencies, TypeScript support, and React 18+ compatible.
          </p>
          <p>
            <a href="https://github.com/ankit64jangir/react-instagram-stories"
              >View on GitHub</a
            >
            |
            <a href="https://www.npmjs.com/package/react-instagram-stories"
              >Install from NPM</a
            >
          </p>
        </section>

        <section aria-label="Features">
          <h2>Built for Modern Experiences</h2>
          <p>
            Everything you need for a fast, accessible, and delightful user
            experience.
          </p>
          <ul>
            <li>
              <strong>3D Cube Transition</strong> — Instagram-style 3D cube drag
              to peek at and switch between users
            </li>
            <li>
              <strong>Tailwind CSS Support</strong> — Fully customizable via
              classNames props, style every sub-element with Tailwind or custom
              CSS
            </li>
            <li>
              <strong>High Performance</strong> — Virtualized list, smart
              preloading, and 60fps hardware-accelerated animations
            </li>
            <li>
              <strong>Media Support</strong> — Images, videos, text, and custom
              React components
            </li>
            <li>
              <strong>Keyboard and Touch</strong> — Full keyboard navigation,
              tap, drag, and long-press support
            </li>
            <li>
              <strong>Accessible</strong> — ARIA labels, keyboard support, and
              screen reader friendly
            </li>
          </ul>
        </section>

        <section aria-label="Performance">
          <h2>Performance Optimized</h2>
          <p>
            Built from the ground up for speed and efficiency. Handle thousands
            of stories without breaking a sweat.
          </p>
          <ul>
            <li>
              <strong>Virtualized Rendering</strong> — Only renders visible
              stories, supporting 1000+ users smoothly
            </li>
            <li>
              <strong>Smart Preloading</strong> — Automatically preloads next
              stories for seamless transitions
            </li>
            <li>
              <strong>Optimized Animations</strong> — 60fps smooth animations
              using hardware acceleration
            </li>
            <li>
              <strong>Zero Dependencies</strong> — Lightweight ~30 KB bundle
              with zero runtime dependencies
            </li>
          </ul>
        </section>

        <section aria-label="Content Types">
          <h2>Rich Content Types</h2>
          <p>
            Support for any content type you can imagine. From simple images to
            interactive experiences.
          </p>
          <ul>
            <li>
              <strong>Images</strong> — Support for any image format with
              automatic aspect ratio handling
            </li>
            <li>
              <strong>Videos</strong> — Auto-playing videos with audio support
              and buffering detection
            </li>
            <li>
              <strong>Text</strong> — Beautiful text overlays with customizable
              colors and backgrounds
            </li>
            <li>
              <strong>Custom Components</strong> — Embed any React component for
              polls, quizzes, products, and more
            </li>
          </ul>
        </section>

        <section aria-label="Installation">
          <h2>Quick Start</h2>
          <p>Install react-instagram-stories with npm:</p>
          <pre><code>npm install react-instagram-stories</code></pre>
        </section>

        <section aria-label="Accessibility">
          <h2>Accessible by Default</h2>
          <p>
            Built with accessibility in mind. Everyone can enjoy your stories,
            regardless of how they interact.
          </p>
          <ul>
            <li>
              <strong>Keyboard Navigation</strong> — Complete keyboard support
              with arrow keys, space, and escape
            </li>
            <li>
              <strong>Screen Reader Ready</strong> — ARIA labels and semantic
              HTML for accessibility tools
            </li>
            <li>
              <strong>Reduced Motion</strong> — Respects user preferences for
              reduced motion animations
            </li>
            <li>
              <strong>Focus Management</strong> — Proper focus handling for
              keyboard and screen reader users
            </li>
          </ul>
        </section>
